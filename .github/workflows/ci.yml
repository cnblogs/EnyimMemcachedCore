name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0

    services:
      memcached:
        image: memcached:1.5.8

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Build
      run: ./build.sh
    - name: Test
      run: ./test.sh